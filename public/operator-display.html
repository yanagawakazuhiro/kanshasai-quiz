<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>クイズ全体表示 - 運用者</title>

    <link rel="stylesheet" href="display.css" />
  </head>
  <body class="page-display">
    <!-- クイズ開始前の待機画面（QRコードと動画） -->
    <div id="pre-quiz-screen" class="pre-quiz-screen">
      <div class="pre-quiz-content">
        <div class="qr-section">
          <h2>参加者はこちら</h2>
          <div id="qr-code-container">
            <img
              id="qr-code-img"
              src=""
              alt="参加用QRコード"
            />
          </div>
          <div id="join-url-display" class="join-url-display">
            読み込み中...
          </div>
        </div>
        <div class="video-section">
          <h2>動画を再生中...</h2>
          <div id="youtube-player-container" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <div id="youtube-player"></div>
          </div>
          <div class="video-controls">
            <button id="skip-video-btn">動画をスキップ</button>
            <button id="replay-video-btn" style="display: none;">動画を再生し直す</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 既存のQRコードバッジ（クイズ中は非表示） -->
    <div id="join-qr-badge" class="join-qr-badge" style="display: none;">
      <div class="join-qr-title">参加者はこちら</div>
      <img
        id="join-qr-img"
        src="https://res.cloudinary.com/dbndj9yfr/image/upload/v1766738084/QR_738068_wgke9r.png"
        alt="参加用QR"
      />
      <div id="join-url" class="join-qr-url">
        読み込み中...
      </div>
    </div>
    <div class="container" id="quiz-container" style="display: none;">
      <header id="topbar">
        <div id="countdown-container">
          <div id="countdown">--</div>
        </div>

        <div id="quiz-controls-display">
          <button id="startQuizBtnDisplay">クイズ開始</button>
          <button id="showResultsBtnDisplay" style="display: none">
            結果を表示
          </button>
          <button id="nextQuestionBtnDisplay" disabled>次の問題</button>
          <button id="endQuizBtnDisplay" disabled>クイズ終了</button>
        </div>
      </header>
      <div id="display-status" style="display: none"></div>

      <section id="question-area">
        <p id="question-text">問題が表示されます</p>
      </section>

      <section id="options">
        <div class="option" data-id="A">
          <div class="option-label">A</div>
          <img class="option-image" alt="" />
          <video class="option-video" controls></video>
          <div class="option-text"></div>
        </div>

        <div class="option" data-id="B">
          <div class="option-label">B</div>
          <img class="option-image" alt="" />
          <video class="option-video" controls></video>
          <div class="option-text"></div>
        </div>

        <div class="option" data-id="C">
          <div class="option-label">C</div>
          <img class="option-image" alt="" />
          <video class="option-video" controls></video>
          <div class="option-text"></div>
        </div>

        <div class="option" data-id="D">
          <div class="option-label">D</div>
          <img class="option-image" alt="" />
          <video class="option-video" controls></video>
          <div class="option-text"></div>
        </div>
      </section>

      <!-- クイズ終了メッセージとランキング表示エリア -->
      <section id="quiz-end-message-area">
        <p id="final-message">終了</p>

        <div id="ranking-area">
          <h2>最終ランキング</h2>
          <ul id="ranking-list"></ul>
        </div>

        <button id="return-to-start-btn" style="display: none">
          開始画面に戻る
        </button>
      </section>
    </div>
    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- メインスクリプト -->
    <script src="operator-display.js"></script>
  </body>
</html>

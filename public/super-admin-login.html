<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スーパー管理者ログイン</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .login-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        width: 100%;
        max-width: 400px;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
        text-align: center;
      }

      .subtitle {
        color: #666;
        text-align: center;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #333;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 14px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #667eea;
      }

      .error-message {
        color: #e74c3c;
        font-size: 14px;
        margin-top: 10px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
      }

      .btn-secondary:hover {
        background: #f5f5f5;
      }

      .loading {
        display: none;
        text-align: center;
        color: #666;
        margin-top: 20px;
      }

      .loading.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>スーパー管理者ログイン</h1>
      <p class="subtitle">サイト提供者用ログイン</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">ユーザー名</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            autocomplete="username"
            placeholder="ユーザー名を入力"
          />
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="パスワードを入力"
          />
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="button-group">
          <button type="submit" class="btn-primary" id="loginBtn">
            ログイン
          </button>
          <button type="button" class="btn-secondary" id="cancelBtn">
            キャンセル
          </button>
        </div>
      </form>

      <div class="loading" id="loading">ログイン中...</div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const errorMessage = document.getElementById("errorMessage");
      const loginBtn = document.getElementById("loginBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const loading = document.getElementById("loading");

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("show");
      }

      function hideError() {
        errorMessage.classList.remove("show");
      }

      function setLoading(isLoading) {
        loginBtn.disabled = isLoading;
        loading.classList.toggle("show", isLoading);
        if (isLoading) {
          loginBtn.textContent = "ログイン中...";
        } else {
          loginBtn.textContent = "ログイン";
        }
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();
        setLoading(true);

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          showError("ユーザー名とパスワードを入力してください");
          setLoading(false);
          return;
        }

        try {
          const response = await fetch("/api/auth/super-admin/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include", // セッションクッキーを送信
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            // ログイン成功
            window.location.href = "/super-admin.html";
          } else {
            // ログイン失敗
            showError(data.message || "ログインに失敗しました");
            setLoading(false);
          }
        } catch (error) {
          console.error("ログインエラー:", error);
          showError("通信エラーが発生しました");
          setLoading(false);
        }
      });

      cancelBtn.addEventListener("click", () => {
        window.location.href = "/";
      });

      // 既にログインしているか確認
      (async () => {
        try {
          const response = await fetch("/api/auth/super-admin/status", {
            credentials: "include",
          });
          const data = await response.json();
          if (data.isLoggedIn) {
            window.location.href = "/super-admin.html";
          }
        } catch (error) {
          console.error("ステータス確認エラー:", error);
        }
      })();
    </script>
  </body>
</html>
